<!--caption: 能量收支方向与体重变化速率。刻度取自结论登记表中的 claim-gain-rate，来源：Garthe 等 2013（增重侧）与 Garthe 等 2011（减重侧）。刻度是研究得出的推荐区间，不是对个体的预测。-->
<svg data-kind="quantitative" data-claim="claim-gain-rate" viewBox="0 0 640 300" role="img" aria-label="能量盈余与亏空下推荐的每周体重变化速率区间" xmlns="http://www.w3.org/2000/svg">
  <g stroke="currentColor" fill="none" stroke-width="1">
    <path d="M60 150 L600 150" />
    <path d="M330 40 L330 260" />
    <path d="M595 145 L600 150 L595 155" />
  </g>
  <rect x="340" y="104" width="120" height="42" fill="var(--accent)" stroke="none" opacity="0.85" />
  <rect x="200" y="154" width="120" height="42" fill="var(--accent)" stroke="none" opacity="0.5" />
  <text x="330" y="282" fill="currentColor" text-anchor="middle" font-size="14">← 能量亏空（减脂期）　　能量盈余（增肌期）→</text>
  <text x="400" y="95" fill="currentColor" text-anchor="middle" font-size="14">+0.25%～0.5% 体重／周</text>
  <text x="260" y="212" fill="currentColor" text-anchor="middle" font-size="14">−0.5%～1.0% 体重／周</text>
  <text x="470" y="130" fill="currentColor" font-size="13">再快，多出来的主要是脂肪</text>
  <text x="70" y="180" fill="currentColor" font-size="13">再快，瘦体重与力量一起掉</text>
  <text x="340" y="55" fill="currentColor" font-size="13">收支平衡线</text>
</svg>
